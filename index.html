  <!-- Structured Data JSON-LD (LegalService / Organization & OfferCatalog) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LegalService",
    "name": "Sensirupt",
    "description": "Boutique techno-legal advisory integrating IP strategy, technology transactions, venture diligence and privacy law. Founded by former directors of US multinationals.",
    "url": "https://sensirupt.com",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Techno-Legal Strategy Services",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "IP Strategy & Valuation",
            "description": "Monetising patents and intangible assets, with claim architecture that stands up in financing and M&A."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Tech Law & Transactions",
            "description": "Structuring high-stakes, IP-centric alliances and technology conveyance across borders."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Venture Advisory",
            "description": "Techno-legal due diligence for funds and VCs, from clean IP title to defensibility of the moat."
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Privacy & Media Law",
            "description": "Navigating complex data-protection and entertainment regulation."
          }
        }
      ]
    }
  }
  </script>
