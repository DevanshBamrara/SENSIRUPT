<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0B1528" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8BE8" />
      <stop offset="100%" stop-color="#8DBDF0" />
    </linearGradient>
  </defs>

  <!-- Background Squircle with Subtle Brand Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(141, 189, 240, 0.25)" stroke-width="8" />

  <!-- Monogram S with Period Dot -->
  <g transform="translate(54, 8)">
    <!-- True Serif 'S' letterform (Proper orientation: top terminal at top-left, spine across to bottom-right) -->
    <path d="M 107 155 C 107 130 137 118 177 118 C 230 118 270 142 276 186 L 224 192 C 220 165 200 154 177 154 C 154 154 142 164 142 178 C 142 194 156 204 192 215 C 242 230 277 252 277 298 C 277 348 234 376 176 376 C 114 376 70 346 66 295 L 120 289 C 124 322 147 338 176 338 C 204 338 219 324 219 303 C 219 283 204 274 166 261 C 114 243 107 212 107 155 Z" fill="#FFFFFF" />
    
    <!-- Signature Electric Blue Period Dot '.' -->
    <circle cx="320" cy="348" r="24" fill="url(#dotGrad)" />
  </g>
</svg>
